name: Extract HD Enhance Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP file not found"
            exit 1
          fi
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract
        run: |
          mkdir -p /tmp/project
          unzip -o "$ZIP_FILE" -d /tmp/project
          PROJECT_DIR=$(find /tmp/project -mindepth 1 -maxdepth 1 -type d | head -n 1)
          cp -a "$PROJECT_DIR"/. .

      - name: Remove ZIP
        run: rm -f "$ZIP_FILE"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Extract HD Enhance project" || echo "No changes"
          git push
